appId: com.geoffreyianward.wyrmstar
productName: WyrmStar
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: WyrmStar
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: WyrmStar reads and writes your novel projects here.
    - NSDownloadsFolderUsageDescription: WyrmStar can export compiled manuscripts here.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Geoffrey Ward
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Used only to upload built installers to GitHub Releases from CI (`--publish
# always`); the app has no auto-updater wired in, so this isn't a live
# update channel yet.
publish:
  provider: github
  owner: GeoffreyIanWard
  repo: wyrmscript

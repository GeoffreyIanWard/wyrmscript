appId: com.geoffreyianward.wyrmstar
productName: WyrmStar
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: WyrmStar
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: WyrmStar reads and writes your novel projects here.
    - NSDownloadsFolderUsageDescription: WyrmStar can export compiled manuscripts here.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  # snap dropped: it needs snapcraft installed plus separate Snap Store
  # credentials neither of which CI has, and it fails the whole build step
  # (a single electron-builder process covers all three targets) even after
  # AppImage and deb have already built and uploaded successfully. AppImage
  # + deb cover desktop Linux users for this test round.
  target:
    - AppImage
    - deb
  maintainer: Geoffrey Ward
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Used only to upload built installers to GitHub Releases from CI (`--publish
# always`); the app has no auto-updater wired in, so this isn't a live
# update channel yet. releaseType:release because electron-builder defaults
# to a draft release, invisible to the public and to /releases/latest — the
# first real release run landed as an unpublished draft with a working
# download page pointing at nothing, and it took a manual `gh release edit
# --draft=false` to fix. Never rely on remembering that step again.
#
# It must be `releaseType`, not `draft: false`: GithubOptions is
# `additionalProperties: false` in electron-builder 26.x and has no `draft`
# key at all, so `draft: false` fails every branch of the publish `oneOf`.
# ajv then reports that as five confusing "configuration.publish.provider
# must be equal to constant" errors — one per provider branch — which says
# nothing about the key actually at fault. That is exactly how v0.2.0's
# first build failed on all three platforms.
publish:
  provider: github
  owner: GeoffreyIanWard
  repo: wyrmscript
  releaseType: release
